name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "同时发布到 npm（需先配置 NPM_TOKEN secret；不发 npm 就保持关闭）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check & build（独立 CI tsconfig，不依赖任何本机绝对路径）
        run: npx tsc -p tsconfig.ci.json

      - name: Test
        run: npm test

  github-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # ── 可选：npm 发布通道。决定不走 npm 就整段删除这个 job。────────
  npm-publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npx tsc -p tsconfig.ci.json

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
